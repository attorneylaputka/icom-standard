  org: assistants, rules, protocol
  pr: client services
  sys: systems and platforms
  ops: process and delivery
  mk: marketing
  fin: finance
  lg: legal practice and compliance
  rs: research
  dt: data and reporting
  x: "unclassed; send as x.<word> and reclassify within 7 days"
