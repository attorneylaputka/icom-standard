facets:
  cfg: config
  err: incident or bug
  doc: documentation
  test: test or QC
  cost: spend
  plan: plan or design
  "st.*": US state jurisdiction, e.g. st.pa
  "v.*": version, e.g. v.2
tombstones: {}  # none yet
fields:
  f: "file path or record location; reference it, do not restate the contents"
  ref: "name of the place a record or secret is kept; never the value"
  fn: function or service name
  v: version or deploy id
  rb: rollback target
  n: count
  err: error count
  why: reason; comma-separated if more than one
  ask: what you need from the recipient; alternatives separated by |
  nx: next step, written AGENT:action
  own: owner code
  cc: other assistant codes to copy, comma-separated
  ret: what to report back, written AGENT:action
  until: deadline or resume time
  qa: review result, written AGENT:pass/total
  impact: impact count; 0 means none
  scope: "client or matter id only; never a name"
  co: "company selector; a comptroller code only; never the company name"
  ok: count of compliant messages in an audit
  bloat: count of bloated messages in an audit
  bad: count of noncompliant messages in an audit
paths:
  "%w": ~/work
