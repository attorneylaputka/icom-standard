# ICOM codebook — Laputka Law Office.
#
# Editor: ICOM is the only assistant who edits this file.
# Approver: MARIAG (Maria G, chief of staff) approves new codes from ICOM's weekly proposal.
# Append-only after this version. A retired code is tombstoned and never reused.
#
# The generic sample registry shipped upstream through 1.5.0 (LEAD, COMMS, the CL lanes,
# legacy objects such as contacts.import) was not a live firm book. It is replaced here
# rather than tombstoned, the same decision as the firm's ICX book. Do not repeat that
# exception. The next edit appends or tombstones.
#
# Topics in `objects` are the firm ICX codes, copied so a message can be checked offline.
# Canonical book and plain-English index:
#   https://github.com/attorneylaputka/icx  (examples/codebook.yaml, examples/index.yaml)
# A code never carries a client name, a matter name, a company name, or a secret.
# Copied from the ICX book on 2026-10-22.
version: 2.0.0
updated: 2026-10-22
rules:
  max_code_len: 6
  case: "UPPER for assistants and lanes; lower.dot for topics"
  editor: ICOM
  approver: MARIAG
  secrets: "name the place a record or secret is kept; never write the value"
  names: "no client name, matter name, or company name in a code"
verbs:
  GO: start, or approved to proceed
  HOLD: pause; do not proceed
  DONE: completed
  BLOCKED: cannot proceed; needs ask=
  REC: recommendation; an action may follow the verb (REC HOLD)
  FYI: info only; no reply expected
  ASK: question that needs an answer
  ACK: received and understood
  NAK: rejected, or cannot parse
priority:
  P0: now; drop everything else
  P1: today
  P2: this week
  P3: whenever
agents:  # UPPER, 6 characters or fewer. Neutral codes. Never a client name.
  MARIAG: "Maria G, chief of staff; only assistant who speaks to Charles; approves codebook changes"
  JEN: "Jen, calendar and email"
  GAUNT: "Gauntlet, independent reviewer of accuracy and completeness"
  POLL: "Inbox Puller for the attorney inbox"
  ICOM: "router; only editor of this codebook"
  CTO: "technology"
  TEAMS: "Teams Bot"
  CFO: "finance lead"
  CLAP: "comptroller CLAP"
  CILL: "comptroller CILL"
  CCLR: "comptroller CCLR"
  CWAT: "comptroller CWAT"
  CMON: "comptroller CMON"
  CPRE: "comptroller CPRE"
  CBIG: "comptroller CBIG"
  CFUN: "comptroller CFUN"
  CWES: "comptroller CWES"
  TRAV: "Travel Agent"
  FLT: "flights"
  HTL: "hotels"
  CAR: "rental cars"
  REST: "restaurants"
  TRV: "travel review"
reports:  # org line. Comptrollers report only to CFO. Travel sub-bots report to TRAV. Everyone else reports to MARIAG.
  JEN: MARIAG
  GAUNT: MARIAG
  POLL: MARIAG
  ICOM: MARIAG
  CTO: MARIAG
  TEAMS: MARIAG
  CFO: MARIAG
  CLAP: CFO
  CILL: CFO
  CCLR: CFO
  CWAT: CFO
  CMON: CFO
  CPRE: CFO
  CBIG: CFO
  CFUN: CFO
  CWES: CFO
  TRAV: MARIAG
  FLT: TRAV
  HTL: TRAV
  CAR: TRAV
  REST: TRAV
  TRV: TRAV
clients:  # lanes. The only lane in this book is the internal one. Client, matter, and company names are not codes.
  INT0: "internal; no client"
pilot:  # first week. ICOM NAKs any other sender with why=pilot until MARIAG ends it.
  senders: [MARIAG, JEN, GAUNT, ICOM]
  end: "MARIAG sends GO org.agent to ICOM on a ticket. ICOM then removes this block."
money:
  rule: "No money moves without Charles's explicit approval, routed through MARIAG."
  approval_topic: fin.paybl.apprv
  standing_topic: org.rule.apprv
  remind_only: [fin.payrl]
  holds: [fin.paybl, fin.fee.refund]
